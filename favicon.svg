<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7047EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6DFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF8A65;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="#151521"/>
  <!-- Shield shape -->
  <path d="M32 8 L52 16 L52 30 C52 42 42 52 32 56 C22 52 12 42 12 30 L12 16 Z"
        fill="url(#shieldGrad)" opacity="0.9" filter="url(#glow)"/>
  <!-- Lock body -->
  <rect x="24" y="30" width="16" height="14" rx="3" fill="white" opacity="0.95"/>
  <!-- Lock shackle -->
  <path d="M26 30 L26 24 C26 19.6 38 19.6 38 24 L38 30"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- Keyhole -->
  <circle cx="32" cy="36" r="2.5" fill="#7047EB"/>
  <rect x="31" y="37" width="2" height="4" rx="1" fill="#7047EB"/>
  <!-- AI spark top right -->
  <circle cx="50" cy="14" r="2" fill="#FF9F2E" opacity="0.8"/>
  <line x1="50" y1="10" x2="50" y2="12" stroke="#FF9F2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="14" x2="52" y2="14" stroke="#FF9F2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="11" x2="51.4" y2="12.6" stroke="#FF9F2E" stroke-width="1" stroke-linecap="round"/>
</svg>
